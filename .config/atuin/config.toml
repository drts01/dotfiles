update_check           = false
workspaces             = true
command_chaining       = true
prefers_reduced_motion = true
history_filter         = [
  "^clear$",
  "^exit$",
  "^rehash$",
  ".* (aws_access_key_id|aws_session_token) .*",
]

[logs]
enabled = false

[theme]
name = "dracula"

[ui]
columns = [ "duration", "datetime", "exit", "command" ]
