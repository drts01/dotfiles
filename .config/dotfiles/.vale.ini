# https://docs.vale.sh/topics/.vale.ini
# Repository layer for the dotfiles project. Vale reads the user-level file, .config/vale/.vale.ini,
# first and lays this file over it: styles and StylesPath come from there.
# The prek hooks point XDG_CONFIG_HOME at the checkout, so the user-level layer is the tracked file, not a stale deployed copy.

# Adds to the user-level General vocabulary: names only this project's pages use.
Vocab = House

[*.md]
# Diagram source is Mermaid, not prose.
BlockIgnores = (?s)(\{% <devlab\.diagram.*?\{% </devlab\.diagram> %\})
# Zola template tags and heading IDs are markup, not prose.
TokenIgnores = (\{%[^%]*%\}), (\{#[^}]*\})
# Changelog headings use "date: summary"; mise headings must stay lowercase.
Microsoft.HeadingColons = NO

# Speaker notes and abstracts use the speaker's own voice.
[.config/dotfiles/docs/talks/*.md]
Microsoft.FirstPerson = NO
