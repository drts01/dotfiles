[lint]
description = "Run lint checks (auto-detects CI)"
dir         = "{{config_root}}"
run         = "prek run --config .config/dotfiles/prek.toml --all-files ${CI_FLAGS:-}"

[lint.env]
CI_FLAGS = "{% if env.CI is defined %}--show-diff-on-failure --color=always --stage manual{% endif %}"

["shell:test"]
description = "Run ShellSpec unit and startup tests"
tools       = { shellspec = "latest" }
dir         = "{{config_root}}/.config/dotfiles"
run         = "shellspec --shell /bin/sh"

["shell:test:tools"]
description = "Smoke-test pinned mise tools in isolated sh, Bash, and Zsh startup"
dir         = "{{config_root}}/.config/dotfiles"
run         = "sh tests/mise-smoke.sh"

["shell:test:posix"]
description = "Test the OS /bin/sh shell configuration"
tools       = { shellspec = "latest" }
dir         = "{{config_root}}/.config/dotfiles"
run         = "shellspec --shell /bin/sh spec/unit spec/startup/posix_spec.sh"

["shell:test:bash"]
description = "Test Bash shell configuration"
tools       = { shellspec = "latest" }
dir         = "{{config_root}}/.config/dotfiles"
run         = "TEST_BASH=required shellspec --shell bash spec/unit spec/startup/bash_spec.sh"

["shell:test:zsh"]
description = "Test Zsh shell configuration"
tools       = { shellspec = "latest" }
dir         = "{{config_root}}/.config/dotfiles"
run         = "shellspec --shell zsh spec/unit spec/startup/zsh_spec.sh"

["bootstrap:test"]
description = "Test bootstrap and selective submodules in throwaway homes without mise"
dir         = "{{config_root}}/.config/dotfiles"
run         = "sh tests/bootstrap.sh && sh tests/bootstrap-submodules.sh"

["bootstrap:test:container"]
description = "Run bootstrap and shell tests as non-root in containers (podman or docker); pass images to select"
dir         = "{{config_root}}/.config/dotfiles"
run         = "sh tests/bootstrap-container.sh"

["shell:bench"]
description = "Benchmark isolated warm shell startup"
tools       = { hyperfine = "latest" }
dir         = "{{config_root}}/.config/dotfiles"
run         = "sh bench/shell-startup.sh"

["docs:serve"]
description = "Preview documentation site locally"
tools       = { zola = "latest" }
dir         = "{{config_root}}/.config/dotfiles/docs"
run         = "zola serve --open"

["docs:build"]
description = "Build static documentation site"
tools       = { zola = "latest" }
dir         = "{{config_root}}/.config/dotfiles/docs"
run         = "zola build"
