# House style for the documentation site; run by the `vale` prek hook.
# Styles are local so linting never downloads packages.
StylesPath = vale
MinAlertLevel = error

[*.md]
BasedOnStyles = House
# Diagram source is Mermaid, not prose.
BlockIgnores = (?s)(\{% <devlab\.diagram.*?\{% </devlab\.diagram> %\})
