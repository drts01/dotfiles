[settings]
enable_tools        = [ "prek", "zola" ]  # Prevents tool install from other configurations
locked              = true
lockfile            = true
lockfile_mode       = "generate"
minimum_release_age = "3d"

[tasks."install-hooks"]
description = "Install prek pre-commit hooks patched for the bare repo"
tools       = { prek = "latest" }
run         = "install-hooks.sh"
env         = { BASEDIR = "{{config_root}}" }

[tasks.bootstrap]
description = "Full post-clone setup: tools + git hooks"
depends     = [ "install-hooks" ]

[tasks.doctor]
description = "Verify bootstrap succeeded: tools and hooks"
run         = "doctor.sh"

[tasks.update]
description  = "Pull latest dotfiles, sync submodules, and re-run bootstrap"
run          = "update.sh"
depends_post = [ "bootstrap" ]

[tasks."docs:serve"]
description = "Preview documentation site locally"
tools       = { zola = "latest" }
dir         = "{{config_root}}/docs"
run         = "zola serve --open"

[tasks."docs:build"]
description = "Build static documentation site"
tools       = { zola = "latest" }
dir         = "{{config_root}}/docs"
run         = "zola build"
