default_install_hook_types = [ "commit-msg", "pre-commit", "pre-push" ]
exclude                    = "\\.lock"

[[repos]]
repo  = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo  = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json", exclude = ".config/zed/settings\\.json" },
  { id = "check-json5" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-vcs-permalinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace", args = [ "--markdown-linebreak-ext=md" ] },
  { id = "mixed-line-ending", args = [ "--fix=lf" ] },
]

[[repos]]
repo  = "https://github.com/crate-ci/typos"
rev   = "7f9d0819ca1c008ade73f4b41fa9d258d48f605b"                            # frozen: v1.51.1
hooks = [
  {
    id     = "typos",
    args   = [ "--write-changes", "--config=.config/dotfiles/.typos.toml" ],
    stages = [ "pre-commit", "commit-msg" ]
  },
]

[[repos]]
repo  = "https://github.com/scop/pre-commit-shfmt"
rev   = "479be5958357ba5ab65ce47172117348516860e9"             # frozen: v3.14.1-1
hooks = [
  { id = "shfmt", exclude = '^\.config/dotfiles/spec/' },
  {
    id    = "shfmt",
    name  = "shfmt (shell rc files)",
    types = [ "file" ],
    files = '^\.config/(sh/\.shrc|zsh/zsh\.d/[^/]+\.zshrc)$',
  },
]

[[repos]]
repo  = "https://github.com/shellcheck-py/shellcheck-py"
rev   = "a6564f5d57444e123433a5c9af733e3975c77229"                                                               # frozen: v0.11.0.1-1
hooks = [
  {
    id    = "shellcheck",
    types = [ "file" ],
    files = '(^\.profile$|(^|/)\.(shrc|bashrc|bash_profile)$|^\.config/sh/.*\.sh$|^\.config/dotfiles/.*\.sh$)',
  },
]

[[repos]]
repo  = "https://github.com/tombi-toml/tombi-pre-commit"
rev   = "10da57f75d36ba93b257a4e7f2c70796fa2da683"        # frozen: v1.9.8
hooks = [
  { id = "tombi-format" },                                # Tombi does not have a way to pass a custom path for the configuration
]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev  = "ba2d2344c24a99c2e87325bb4f9b966692ff3c53"      # frozen: v0.28.0

[[repos.hooks]]
id       = "ryl-check-markdown"
name     = "ryl"
alias    = "ryl"
args     = [ "--config-file", ".config/ryl/ryl.toml", "--fix" ]
types_or = [ "yaml", "markdown" ]
files    = '.*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$'
exclude  = '\.config/zed/AGENTS\.md$'
stages   = [ "pre-commit" ]

[[repos.hooks]]
id       = "ryl-check-markdown"
name     = "ryl github"
alias    = "ryl-github"
args     = [ "--config-file", ".config/ryl/ryl.toml", "--format=github" ]
types_or = [ "yaml", "markdown" ]
files    = '.*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$'
exclude  = '\.config/zed/AGENTS\.md$'
stages   = [ "manual" ]

[[repos]]
repo  = "https://github.com/vale-cli/vale"
rev   = "e2d4374b1c66c8a1dd6d912bebc135040d8833fa"                                                                      # frozen: v3.26.0
hooks = [
  {
    id             = "vale",
    alias          = "vale-sync",
    name           = "vale sync",
    pass_filenames = false,
    args           = [
      "--config=.config/vale/.vale.ini",
      "sync",
    ],
    stages         = [ "pre-push" ]
  },
  {
    id      = "vale",
    args    = [ "--config=.config/vale/.vale.ini" ],
    # Agent prompts and talk drafts are not published documentation.
    exclude = '^(\.config/zed/AGENTS\.md|Documents/Cline/Rules/global\.md)',
  },
  { id = "vale-commit-msg", entry = "sh -c 'vale --config=.config/vale/.vale.ini --path=COMMIT_EDITMSG < \"$1\"' --" }
]
