[[repos]]
repo  = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo  = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json", exclude = ".config/zed/settings\\.json" },
  { id = "check-json5" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-vcs-permalinks" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace", args = [ "--markdown-linebreak-ext=md" ] },
  { id = "mixed-line-ending", args = [ "--fix=lf" ] },
]

[[repos]]
repo  = "local"
hooks = [
  {
    id       = "zola-last-updated",
    name     = "Update Zola Date",
    entry    = """
    TODAY=$(date +%Y-%m-%d)
    for file in "$@"; do
        awk -v date="$TODAY" '/^updated[[:space:]]*=/ { $0 = "updated = " date } { print }' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
    done
    """,
    language = "system",
    shell    = "bash",
    files    = '^\.config/dotfiles/docs/content/.*\.md$'
  }
]

[[repos]]
repo  = "https://github.com/crate-ci/typos"
rev   = "7f9d0819ca1c008ade73f4b41fa9d258d48f605b"                            # frozen: v1.51.1
hooks = [
  {
    id     = "typos",
    args   = [ "--write-changes", "--config=.config/dotfiles/.typos.toml" ],
    stages = [ "pre-commit", "commit-msg" ]
  },
]

[[repos]]
repo  = "https://github.com/scop/pre-commit-shfmt"
rev   = "479be5958357ba5ab65ce47172117348516860e9"                                                                     # frozen: v3.14.1-1
hooks = [
  { id = "shfmt", args = [ "-w", "-s", "-i", "2", "-sr", "-ci" ], exclude = ".config/sh/profile.d/10_functions.sh" },
]

[[repos]]
repo  = "https://github.com/shellcheck-py/shellcheck-py"
rev   = "a6564f5d57444e123433a5c9af733e3975c77229"                       # frozen: v0.11.0.1-1
hooks = [
  {
    id    = "shellcheck",
    types = [ "shell" ],
    files = '(^|/)\.(shrc|bashrc|zshrc|zshenv|zprofile|bash_profile)$',
  },
]

[[repos]]
repo  = "https://github.com/tombi-toml/tombi-pre-commit"
rev   = "b3f6e09de51290a21d6c7b05b4f5cbe6cfe65b4f"        # frozen: v1.9.6
hooks = [
  { id = "tombi-format" },                                # Tombi does not have a way to pass a custom path for the configuration
]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev  = "ebab13c478952f480f31b75f3fd7649993a4ce5e"      # frozen: v0.26.1

[[repos.hooks]]
id       = "ryl-check-markdown"
name     = "ryl"
alias    = "ryl"
args     = [ "--config-file", ".config/ryl/ryl.toml", "--fix" ]
types_or = [ "yaml", "markdown" ]
files    = '.*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$'
exclude  = '\.config/zed/AGENTS\.md$'
stages   = [ "pre-commit" ]

[[repos.hooks]]
id       = "ryl-check-markdown"
name     = "ryl github"
alias    = "ryl-github"
args     = [ "--config-file", ".config/ryl/ryl.toml", "--format=github" ]
types_or = [ "yaml", "markdown" ]
files    = '.*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$'
exclude  = '\.config/zed/AGENTS\.md$'
stages   = [ "manual" ]
