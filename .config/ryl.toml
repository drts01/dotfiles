[files]
yaml     = [ "*.yaml", "*.yml", ".yamllint", ".yamlfmt" ]
markdown = [ "*.md", "docs/**/*.md" ]

[rules]
anchors                 = "enable"
braces                  = "enable"
brackets                = "enable"
colons                  = "enable"
commas                  = "enable"
comments-indentation    = "enable"
document-end            = "enable"
empty-lines             = "enable"
empty-values            = "enable"
float-values            = "enable"
hyphens                 = "enable"
indentation             = "enable"
key-duplicates          = "enable"
key-ordering            = "disable"
octal-values            = "enable"
new-line-at-end-of-file = "enable"
new-lines               = "enable"
trailing-spaces         = "enable"
truthy                  = "enable"

[rules.braces]
max-spaces-inside       = 1
max-spaces-inside-empty = 2
min-spaces-inside-empty = 0
max-spaces-inside       = 1
max-spaces-inside-empty = 2
min-spaces-inside-empty = 0

[rules.comments]
min-spaces-from-content = 1

[rules.comments-indentation]
allow-any-open-indent = true

[rules.document-start]
present = true

[rules.document-end]
present = false

[rules.float-values]
require-numeral-before-decimal = true

[rules.indentation]
spaces           = 2
indent-sequences = true

[rules.key-duplicates]
forbid-duplicated-merge-keys = true
check-canonical              = true
forbid-merge-key-shadowing   = true

[rules.key-ordering]
level        = "error"
ignored-keys = [ "^x-" ]

[rules.line-length]
max = 120

[rules.quoted-strings]
quote-type                       = "single"
required                         = "only-when-needed"
allow-quoted-quotes              = true
allow-double-quotes-for-escaping = true
