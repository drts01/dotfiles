[files]
yaml     = [ "*.yaml", "*.yml", ".yamllint", ".yamlfmt" ]
markdown = [ "**/*.md" ]

[lint.rules]
anchors                 = "enable"
brackets                = "enable"
colons                  = "enable"
commas                  = "enable"
empty-lines             = "enable"
empty-values            = "enable"
hyphens                 = "enable"
key-ordering            = "disable"
octal-values            = "enable"
merge-keys              = "enable"
new-line-at-end-of-file = "enable"
new-lines               = "enable"
trailing-spaces         = "enable"
truthy                  = "enable"
unicode-line-breaks     = "enable"

[lint.rules.braces]
max-spaces-inside       = 1
max-spaces-inside-empty = 2
min-spaces-inside-empty = 0

[lint.rules.comments]
min-spaces-from-content = 1

[lint.rules.comments-indentation]
allow-any-open-indent = true

[lint.rules.document-start]
present = true

[lint.rules.document-end]
present = false

[lint.rules.float-values]
require-numeral-before-decimal = true

[lint.rules.indentation]
spaces           = 2
indent-sequences = true

[lint.rules.key-duplicates]
forbid-duplicated-merge-keys = true
check-canonical              = true
forbid-merge-key-shadowing   = true

[lint.rules.line-length]
max = 120

[lint.rules.quoted-strings]
quote-type                       = "single"
required                         = "only-when-needed"
allow-quoted-quotes              = true
allow-double-quotes-for-escaping = true

[lint.rules.tags]
forbid-unsafe-tags   = true
forbid-removed-types = true

[[lint.per-line-ignores]]
path  = "**/.github/workflows/*.y*ml"
regex = "^on:"
rules = [ "truthy" ]
