# https://docs.vale.sh/topics/.vale.ini
StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft, write-good, alex, proselint, Readability, Commits

[*.md if .Meta.published == false or .Meta.draft]
BasedOnStyles = Vale, Microsoft, Readability, write-good, proselint, alex, House
# Diagram source is Mermaid, not prose.
BlockIgnores = (?s)(\{% <devlab\.diagram.*?\{% </devlab\.diagram> %\})
Readability.FleschKincaid = suggestion
Readability.SMOG = suggestion

[COMMIT_EDITMSG]
BasedOnStyles = Commits, Conventional, Commitlint
Commitlint.HeaderLength[max] = 72
