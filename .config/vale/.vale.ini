# https://docs.vale.sh/topics/.vale.ini
# User-level configuration: deploys to ~/.config/vale/.vale.ini, and Vale reads it beneath every run.
# Keep project-specific markup and document types in that project's own .vale.ini.
#
# Custom styles:
#   House      plain-language rules for any prose
#   Generated  patterns common in generated text
#   Technical  technical-writing conventions: product names and acronym definitions
#
# Vocabularies (styles/config/vocabularies/):
#   General    terms that recur in any project; project-only terms belong in that project's vocabulary
StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft, write-good, alex, proselint, Readability, Commits

Vocab = General

[*.md]
BasedOnStyles = Vale, Microsoft, Readability, write-good, proselint, alex, House, Generated, Technical
# Technical documentation regularly uses words with three or more syllables.
Readability.Polysyllables = NO
# House style writes "does not" in full; contractions read as casual in reference text.
Microsoft.Contractions = NO
# Ban every form of "to be"; definitions and reference text need "is".
write-good.E-Prime = NO
# Flags "failed", "executed", and "hook"; alex.Profanity still catches real profanity.
alex.ProfanityUnlikely = NO
# Developers expect "URL"; "address" is ambiguous next to email and IP addresses.
Microsoft.GeneralURL = NO
# Replaced by Technical.Acronyms, which accepts lowercase expansions and domain terms.
Microsoft.Acronyms = NO

[COMMIT_EDITMSG]
# Technical is left out: scopes use lowercase tool names, such as fix(git), and a subject has no room to define acronyms.
BasedOnStyles = Commits, Conventional, Commitlint, House, Generated
Commitlint.HeaderLength[max] = 72
