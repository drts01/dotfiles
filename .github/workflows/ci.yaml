---
name: CI

on:
  push:
    branches-ignore:
      - benchmarks
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/dotfiles/mise.toml
  MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:

      MISE_EXPERIMENTAL: true
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install: false
      - name: Set up development clone
        run: sh .config/dotfiles/dev-setup.sh
      - name: Check shared lock coverage
        run: |
          test "$(mise lock --dry-run --json)" = '[]'
          test "$(mise --cd .config/dotfiles lock --dry-run --json)" = '[]'
      - name: Test doctor against an isolated bare repository
        run: sh .config/dotfiles/tests/doctor.sh
      - name: Test selective submodule installation
        run: sh .config/dotfiles/tests/bootstrap-submodules.sh
      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: lint-${{ runner.os }}-prek-${{ hashFiles('**/.pre-commit-config.yaml', '**/prek.toml') }}
          restore-keys: |
            lint-
      - name: Run prek
        run: mise run lint

  shell:
    name: Shell unit (${{ matrix.runner }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: prek,shellspec
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
        shell: [sh, bash, zsh]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes zsh
      - name: Install ShellSpec
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install_args: shellspec
      - name: Test unit specs
        working-directory: .config/dotfiles
        run: mise exec shellspec@latest -- shellspec --output junit --shell "${{ matrix.shell }}" spec/unit
      - name: Upload failed unit report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-unit-${{ matrix.runner }}-${{ matrix.shell }}
          path: .config/dotfiles/report/
          if-no-files-found: ignore

  shell-startup:
    name: Shell startup (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: prek,shellspec
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes zsh
      - name: Initialize Zsh plugins for startup specs
        run: git submodule update --init -- .local/share/zsh
      - name: Install ShellSpec
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install_args: shellspec
      - name: Test startup specs
        working-directory: .config/dotfiles
        run: mise exec shellspec@latest -- shellspec --output junit --shell /bin/sh spec/startup
      - name: Upload failed startup report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-startup-${{ matrix.runner }}
          path: .config/dotfiles/report/
          if-no-files-found: ignore

  mise-tools:
    name: Mise tools (${{ matrix.runner }})
    needs: [shell, shell-startup]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15-arm64]
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/dotfiles/tests/mise/mise.toml
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/.config/dotfiles/tests/mise
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise:${{ github.workspace }}/.config/dotfiles/mise.toml
      MISE_ENABLE_TOOLS: zoxide,atuin
    steps:
      - name: Configure isolated mise paths
        run: |
          printf 'MISE_CEILING_PATHS=%s:%s\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MISE_CONFIG_DIR=%s/mise-smoke-config/mise\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MISE_DATA_DIR=%s/mise-smoke-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MISE_CACHE_DIR=%s/mise-smoke-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MISE_STATE_DIR=%s/mise-smoke-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'XDG_CONFIG_HOME=%s/mise-smoke-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Initialize Zsh plugins for startup checks
        run: git submodule update --init -- .local/share/zsh
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install: false
          cache: false
          add_shims_to_path: false
          env: false
          export_path: false
      - name: Install pinned tools
        working-directory: .config/dotfiles/tests/mise
        run: |
          echo "Runner: $ImageOS $ImageVersion ($RUNNER_ARCH)"
          mise --version
          mise install --locked
          mise exec --locked -- zoxide --version
          mise exec --locked -- atuin --version
      - name: Test real tool startup
        run: sh .config/dotfiles/tests/mise-smoke.sh

  bootstrap:
    name: Bootstrap (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # One job per image so they run in parallel; add an image here to cover it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            runner: ubuntu-latest
            image: buildpack-deps:stable-scm
            bash_test: required
          - name: alpine
            runner: ubuntu-latest
            image: alpine:latest
            bash_test: skip
          - name: fedora
            runner: ubuntu-latest
            image: fedora:latest
            bash_test: required
          - name: chainguard
            runner: ubuntu-latest
            image: cgr.dev/chainguard/git:latest-dev
            bash_test: required
          - name: ubuntu
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellSpec for container tests
        if: matrix.image
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install_args: shellspec
      # Same runner as `mise run bootstrap:test:container` in a configured clone.
      - name: Test bootstrap as non-root (container)
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
          TEST_BASH: ${{ matrix.bash_test }}
        run: sh .config/dotfiles/tests/bootstrap-container.sh "$IMAGE"
      - name: Test bootstrap (host)
        if: ${{ !matrix.image }}
        run: sh .config/dotfiles/tests/bootstrap.sh
