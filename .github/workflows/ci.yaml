---
name: CI

on: [push, workflow_call]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/dotfiles/mise.toml
  PREKFILE: ${{ github.workspace }}/.config/dotfiles/prek.toml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # To upload SARIF files
      contents: read  # To clone the repo
      actions: read  # To read workflow run info
    env:
      MISE_EXPERIMENTAL: true
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          install_args: prek
      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: lint-${{ runner.os }}-prek-${{ hashFiles('**/.pre-commit-config.yaml', '**/prek.toml') }}
          restore-keys: |
            lint-
      - name: Run prek
        run: mise task run lint
      - name: Upload Zizmor SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install Zsh
        run: sudo apt-get install --yes zsh
      - name: Test shell configuration
        run: sh .config/dotfiles/tests/shell.sh

  bootstrap:
    name: Bootstrap (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # One job per image so they run in parallel; add an image here to cover it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            runner: ubuntu-latest
            image: buildpack-deps:stable-scm
          - name: alpine
            runner: ubuntu-latest
            image: alpine:latest
          - name: fedora
            runner: ubuntu-latest
            image: fedora:latest
          - name: chainguard
            runner: ubuntu-latest
            image: cgr.dev/chainguard/git:latest-dev
          - name: ubuntu
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Same runner as `mise run bootstrap:test:container` locally.
      - name: Test bootstrap as non-root (container)
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
        run: sh .config/dotfiles/tests/bootstrap-container.sh "$IMAGE"
      - name: Test bootstrap (host)
        if: ${{ !matrix.image }}
        run: sh .config/dotfiles/tests/bootstrap.sh
